{% extends 'base.html' %}{% block title %}Editar registro{% endblock %}{% block content %}<section class="titulo"><div><p class="eyebrow">Gestión</p><h1>Editar registro</h1><p>{{ registro.id_empleado }} · {{ registro.fecha }}</p></div></section><form class="tarjeta formulario" method="post"><div class="fila"><label>Hora de entrada<input type="time" name="hora_entrada" value="{{ registro.hora_entrada }}" required></label><label>Hora de salida <span>(opcional)</span><input type="time" name="hora_salida" value="{{ registro.hora_salida or '' }}"></label></div><div class="acciones"><a class="boton secundario" href="{{ url_for('consultar') }}">Cancelar</a><button class="boton" type="submit">Guardar cambios</button></div></form>{% endblock %}
