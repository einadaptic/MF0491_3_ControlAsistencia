<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Control de asistencia{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='css/estilos.css') }}"></head>
<body><header class="cabecera"><a class="marca" href="{{ url_for('inicio') }}"><span>◷</span> Control de asistencia</a><button class="menu-boton" aria-label="Abrir menú" aria-expanded="false">☰</button><nav class="menu"><a href="{{ url_for('inicio') }}">Inicio</a><a href="{{ url_for('registrar') }}">Registrar</a><a href="{{ url_for('consultar') }}">Registros</a></nav></header><main class="contenedor">{% with mensajes=get_flashed_messages(with_categories=true) %}{% for categoria,mensaje in mensajes %}<div class="alerta {{ categoria }}">{{ mensaje }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>Control de asistencia · Proyecto formativo</footer><script src="{{ url_for('static',filename='js/app.js') }}"></script></body></html>
