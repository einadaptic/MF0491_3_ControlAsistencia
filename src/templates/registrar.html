{% extends 'base.html' %}{% block title %}Registrar asistencia{% endblock %}{% block content %}<section class="titulo"><div><p class="eyebrow">Nuevo fichaje</p><h1>Registrar asistencia</h1><p>Indica los datos de entrada y, si corresponde, de salida.</p></div></section><form class="tarjeta formulario" method="post"><label>Número de empleado<input name="empleado" inputmode="numeric" pattern="(?:EMP)?[0-9]{1,3}" placeholder="Ej. 25 o EMP025" required><small>Entre 1 y 999</small></label><label>Fecha<input type="date" name="fecha" value="{{ hoy }}" required></label><div class="fila"><label>Hora de entrada<input type="time" name="hora_entrada" required></label><label>Hora de salida <span>(opcional)</span><input type="time" name="hora_salida"></label></div><div class="acciones"><a class="boton secundario" href="{{ url_for('inicio') }}">Cancelar</a><button class="boton" type="submit">Guardar asistencia</button></div></form>{% endblock %}
