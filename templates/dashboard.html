<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Control Asistencia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head>
<body>

    <h1>📊 Resumen y Métricas Globale</h1>
    {% include 'nav.html' %}

    <div class="kpi-grid">
        <div class="card">
            <h2>{{ total_fichajes }}</h2>
            <p>Total Registros</p>
        </div>
        <div class="card">
            <h2>{{ fichajes_hoy }}</h2>
            <p>Fichajes Hoy</p>
        </div>
        <div class="card">
            <h2>{{ empleados_unicos }}</h2>
            <p>Empleados Registrados</p>
        </div>
        <div class="card">
            <h2>{{ pendientes }}</h2>
            <p>Jornadas Pendientes</p>
        </div>
        <div class="card">
            <h2>{{ total_horas }}</h2>
            <p>Horas Computadas</p>
        </div>
    </div>

</body>
</html>
